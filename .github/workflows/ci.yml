name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Check and build web
        run: |
          npm ci --prefix web
          npm run lint --prefix web
          npm test --prefix web
          npm run typecheck --prefix web
          npm run build --prefix web
          npm audit --prefix web --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          if [ -n "$(git status --porcelain -- web/out)" ]; then
            git status --short -- web/out
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  no-vendored-venue-data:
    name: no venue data vendored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every launch venue forbids commercial redistribution of its published schedule
      # (research D6a). No venue dataset may ever be committed here. This gate exists so
      # that rule is enforced by CI rather than by remembering it during review.
      - name: Reject vendored venue datasets
        run: |
          if [ -d data ]; then
            echo "::error::A 'data/' directory is present. Venue schedules must be fetched at"
            echo "::error::run time, never vendored -- see DATA-LICENSING.md and research D6a."
            exit 1
          fi
