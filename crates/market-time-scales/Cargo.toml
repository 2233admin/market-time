[package]
name = "market-time-scales"
description = "Ingest boundary for Mark Time: leap-second-aware conversion from TAI/GNSS/monotonic scales into UTC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
